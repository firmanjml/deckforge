[package]
name = "deckforge-engine"
version = "0.1.0"
edition = "2021"
description = "DeckForge Rust trainer/memory engine (forge)."
license = "GPL-3.0-or-later"

[[bin]]
name = "deckforge-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# x86/x64 instruction decoding (disasm module) and encoding (the Auto
# Assembler's `code_assembler` backend). Pure Rust; operates on bytes read
# from / written to the *target* process (any OS).
iced-x86 = { version = "1", default-features = false, features = ["decoder", "std", "code_asm"] }

# Embedded Lua 5.4 for scripted cheats (trainer packages ship .lua files).
# `vendored` builds Lua from source so no system Lua is required (important
# for SteamOS cross-builds); `send` lets script VMs live on the central
# script worker thread.
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }

# Blocking HTTP client for the trainer store (GitHub trees API + raw content).
# rustls TLS (no system OpenSSL) keeps SteamOS cross-builds dependency-free.
ureq = { version = "2", default-features = false, features = ["tls"] }

# Linux-only system APIs: process_vm_readv / process_vm_writev / procfs.
# On other platforms these are stubbed so the protocol/trainer/signature logic
# still compiles and is unit-testable.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
